[GlobalConfig]
debug_mode: true

[App]
# Nombre del proyecto: el JSON de salida se llamara <project_name>.json
# y se guardara en la carpeta captured_data/
project_name: ikasle

# Protocolo a capturar. Valores validos:
#   arp, dns, tcp, http, dhcp, icmp, tls, mdns
# (tambien conn y pcap_live, que son patrones base del proyecto)
log_type: http

# Interfaz de red por la que se captura. Ajustala a tu equipo:
# en Linux mira el resultado del comando  ip a  (suele ser eth0, ens33, wlan0...)
net_sniffer_interface: eth0

# IMPORTANTE: net_summarize debe ser false para que el sniffer GUARDE
# la captura en el archivo JSON. Si se deja en true, el sniffer solo
# muestra los paquetes por pantalla y no guarda nada.
net_summarize: false

# Filtro BPF opcional: selecciona QUE PAQUETES capturar (no afecta a los
# campos; todos los campos de cada paquete se guardan igualmente).
# Ejemplos: 'tcp port 80' para HTTP, 'icmp' para ICMP, 'arp' para ARP.
# Dejar en blanco para capturar todo el trafico.
net_custome_filters:

[MonitorSystem]
monitor_system_enable: false
monitor_ip: localhost
monitor_port: 5000

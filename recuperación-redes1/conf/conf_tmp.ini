[GlobalConfig]
debug_mode: true

[App]
# Nombre del proyecto (y del fichero JSON de salida).
project_name: ikasle
# Protocolo a capturar (arp, dns, tcp, http, dhcp, icmp, tls, mdns, conn, pcap_live).
log_type: conn
# Interfaz de red a escuchar.
net_sniffer_interface: eth0
# false = guarda en JSON ; true = solo muestra por pantalla.
net_summarize: true
# Filtro BPF opcional (vacio = captura todo).
net_custome_filters:

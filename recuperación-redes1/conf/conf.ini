[GlobalConfig]
debug_mode: true

[App]
# Nombre del proyecto: tambien es el nombre del fichero JSON de salida.
project_name: captura_mdns

# Protocolo a capturar. Valores validos:
#   arp, dns, tcp, http, dhcp, icmp, tls, mdns, conn, pcap_live
log_type: mdns

# Interfaz de red por la que se captura. (eth0, ens33, wlan0...)
net_sniffer_interface: eth0

# IMPORTANTE: net_summarize debe ser false para que el sniffer GUARDE
# la captura en el archivo JSON. Si se deja en true, el sniffer solo
# muestra los paquetes por pantalla y no guarda nada.
net_summarize: false

# Filtro BPF opcional (vacio = se captura todo).
net_custome_filters:
